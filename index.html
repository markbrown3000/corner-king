const evS=q=>q.ev?q.ev[0]+q.ev[1]+q.ev[2]+q.ev[3]+q.ev[4]:0;
function recap(F){
  const S=F.S,a=S.st.A,b=S.st.B,pc=(l,t)=>t?Math.round(100*l/t)+'%':'-',rv=G.set&&G.set.cb?'239,108,0':'229,57,53',me='30,136,229';
  const nm=x=>x.name.split(' ')[1];
  const row=(n,x,y)=>`<tr><td style="text-align:left;padding:3px 0">${x}</td><td style="text-align:center;font-weight:700;color:var(--fg);padding:3px 6px;white-space:nowrap">${n}</td><td style="text-align:right;padding:3px 0">${y}</td></tr>`;
  const stats=`<table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--mut)"><tr><td style="text-align:left;font-weight:700;color:rgb(${me})">${nm(F.b)}</td><td></td><td style="text-align:right;font-weight:700;color:rgb(${rv})">${nm(F.o)}</td></tr>${row('Punches landed',a.ln+'/'+a.th+' ('+pc(a.ln,a.th)+')',b.ln+'/'+b.th+' ('+pc(b.ln,b.th)+')')}${row('Power shots',a.pw,b.pw)}${row('Body shots',a.bd||0,b.bd||0)}${row('Knockdowns',a.kd,b.kd)}${row('Damage dealt',Math.round(a.dm),Math.round(b.dm))}${a.by?['Jabs','Crosses','Hooks','Uppercuts'].map((n,i)=>row(n,a.by[i][1]+'/'+a.by[i][0],b.by[i][1]+'/'+b.by[i][0])).join('')+row('Punches avoided',evS(a),evS(b))+row('Blocked or rolled with',a.rd,b.rd)+row('Counters landed',a.cn,b.cn)+row('Times hurt',a.hu,b.hu)+row('Pinned on the ropes',a.rp,b.rp):''}</table>`+rdTable(S,me,rv);
  const n=S.rc[0].length,td='border-radius:6px;padding:5px 0;';
  const cell=s=>{const[x,y]=s.split('-').map(Number),big=Math.abs(x-y)>1;return`<td style="${td}background:rgba(${x>y?me:rv},${big?.5:.22});${big?'font-weight:700;':''}">${s}</td>`};
